<!DOCTYPE html>
<html lang="zh-CN"><head>
  <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
<script>LA.init({id:"3NutZgJKObmbCE2b",ck:"3NutZgJKObmbCE2b"})</script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>问卷 | 梳子鱼音乐工作室</title>
  <style>
    :root{--c1:#111;--c2:#161616;--c3:#00ffff;--c4:#fff;--glow:0 0 10px var(--c3),0 0 20px var(--c3)}
    *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    body{background:var(--c1);color:var(--c4);line-height:1.8}
    nav{position:sticky;top:0;background:rgba(22,22,22,.4);backdrop-filter:blur(12px);display:flex;justify-content:center;gap:30px;padding:18px 0;z-index:10}
    nav a{color:var(--c4);text-decoration:none;font-weight:500;transition:.3s}
    nav a:hover{color:var(--c3)}
    .sec{max-width:700px;margin:auto;padding:80px 20px}
    h2{margin-bottom:20px;color:var(--c3);text-shadow:var(--glow)}
    .glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:16px;backdrop-filter:blur(10px);padding:40px 30px;margin-bottom:30px}
    .form-group{margin-bottom:20px}
    .form-group label{display:block;margin-bottom:8px;color:#ccc}
    .form-group input,.form-group textarea{width:100%;padding:12px;border:none;border-radius:8px;background:rgba(255,255,255,.1);color:var(--c4);font-size:1rem}
    .form-group input::placeholder,.form-group textarea::placeholder{color:#999}
    .btn-submit{background:var(--c3);color:var(--c1);border:none;padding:14px 36px;border-radius:30px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:.3s;box-shadow:0 0 15px var(--c3)}
    .btn-submit:hover{transform:translateY(-3px);box-shadow:var(--glow)}
    footer{background:rgba(22,22,22,.5);text-align:center;padding:25px 10px;font-size:.9em;color:#aaa}
    @media(max-width:600px){.sec{padding:60px 15px}}
  </style>
</head><body>
  <nav><a href="index.html">首页</a><a href="about.html">关于我们</a><a href="join.html">企业招聘</a><a href="contact.html">联系</a><a href="survey.html">问卷</a></nav>
  <section class="sec">
    <h2>梳子鱼音乐制作报表问卷</h2>
    <form class="glass" onsubmit="sendForm(event)">
      <div class="form-group">
        <label>微信昵称</label>
        <input type="text" name="wechat" placeholder="例：梳子鱼" required>
      </div>
      <div class="form-group">
        <label>对工作室的态度（一句话）</label>
        <input type="text" name="attitude" placeholder="例：专业，期待" required>
      </div>
      <div class="form-group">
        <label>期望值</label>
        <textarea name="expect" rows="3" placeholder="100%" required></textarea>
      </div>
      <div class="form-group">
        <label>联系方式（电话）</label>
        <input type="text" name="contact" placeholder="例：14787417270 或邮箱" required>
      </div>
      <div class="form-group">
        <label>为什么喜欢音乐？</label>
        <textarea name="reason" rows="4" placeholder="例：音乐能让我放松，也想做出自己的歌" required></textarea>
      </div>
      <button type="submit" class="btn-submit">提交问卷</button>
    </form>
  </section>
  <footer>© 2025 梳子鱼音乐工作室　All Rights Reserved.</footer>

  <script>
    function sendForm(e) {
      e.preventDefault();
      const wechat = e.target.wechat.value;
      const attitude = e.target.attitude.value;
      const expect = e.target.expect.value;
      const contact = e.target.contact.value;
      const reason = e.target.reason.value;
      const body = `微信昵称：${wechat}\n对工作室态度：${attitude}\n期望值：${expect}\n联系方式：${contact}\n为什么喜欢音乐：${reason}\n提交时间：${new Date().toLocaleString()}`;

      fetch('https://formsubmit.co/ajax/3156437167@qq.com', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          subject: '新朋友问卷',
          message: body,
          _replyto: contact.includes('@') ? contact : wechat + '@qq.com'
        })
      }).then(res => res.json())
        .then(data => {
          alert('已收到！我们会尽快联系你～');
          e.target.reset();
        }).catch(err => {
          alert('发送失败，请检查网络或手动发邮件');
        });
    }
  </script>
</body></html>
